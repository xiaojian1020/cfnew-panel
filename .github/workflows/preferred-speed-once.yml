name: Preferred speed - one-off dry run

on:
  push:
    branches: [main]
    paths: ['.github/workflows/preferred-speed-once.yml']

permissions:
  contents: read

jobs:
  measure:
    if: github.event.head_commit.message == 'run: preferred speed dry-run once 2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKER_HOST: ${{ secrets.WORKER_HOST }}
      UUID: ${{ secrets.UUID }}
      DRY_RUN: '1'
      SKIP_PROBE: '0'
      RANK_BY: source
      PER_LINE: '5'
      DOWNLOAD_CANDIDATES_PER_LINE: '10'
      DOWNLOAD_ROUNDS: '2'
      MIN_DOWNLOAD_MBPS: '5'
      DOWNLOAD_DURATION_MS: '5000'
      DOWNLOAD_TIMEOUT_MS: '10000'
      DOWNLOAD_MAX_BYTES: '100000000'
      CONCURRENCY: '16'
      TIMEOUT_MS: '8000'
      MIN_OK: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate target without exposing credentials
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.WORKER_HOST || '';
          const url = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw);
          if (url.origin !== 'https://zxj-5tb.pages.dev' || url.pathname !== '/' || url.search || url.hash || url.username || url.password || !process.env.UUID) {
            throw new Error('Secrets are missing or Worker target does not match; nothing will be written');
          }
          NODE
      - name: Run download gate unit tests
        run: node --test test/auto-preferred-speed.test.mjs
      - name: Measure only - never write yx
        run: node scripts/auto-preferred-speed.mjs
