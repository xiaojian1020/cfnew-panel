<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>连接控制台</title>
</head>
<body class="landing">
<main class="login-shell">
  <div class="login-card">
    <div class="login-icon" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
        <path d="M12 3l7 3v5c0 4.5-2.8 7.6-7 9-4.2-1.4-7-4.5-7-9V6l7-3z" fill="white" fill-opacity="0.95"/>
        <path d="M10.2 12.8l-1.7-1.7 1.1-1.1 0.6 0.6 2.7-2.7 1.1 1.1-3.8 3.8z" fill="#f6821f"/>
      </svg>
    </div>
    <h1 class="login-title">连接控制台</h1>
    <p class="login-sub">填写 Worker 域名和 UUID 或自定义路径</p>
    <form action="/panel" method="get" id="connectForm" class="login-form">
      <label class="field">
        <span>Worker 域名</span>
        <input type="text" id="host" name="host" placeholder="worker.example.com" required autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="url" aria-describedby="hostHint">
      </label>
      <small id="hostHint" class="field-hint">仅填写 HTTPS 域名，不带路径；可省略 https://。</small>
      <label class="field">
        <span>UUID 或自定义路径</span>
        <input type="text" id="uuid" name="uuid" placeholder="填写 UUID，或 d 设置的路径" required autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <details id="advancedConnection">
        <summary>高级连接选项</summary>
        <label class="field">
          <span>面板令牌（可选）</span>
          <input type="password" id="token" name="token" placeholder="仅当设置了 PANEL_TOKEN 时需要" autocomplete="off" autocapitalize="none" spellcheck="false">
        </label>
      </details>
      <label class="remember"><input id="remember" type="checkbox" aria-describedby="rememberHint">在这台设备记住节点</label>
      <small id="rememberHint" class="field-hint">勾选后将域名及 UUID／访问路径保存在本浏览器，请勿在公用设备开启。</small>
      <div id="historyControls" class="history-row" hidden>
        <select id="history" aria-label="已保存的节点"></select>
        <button type="button" id="deleteNode" class="btn-ghost" disabled>删除所选</button>
        <button type="button" id="clearAll" class="btn-ghost" hidden>清空全部</button>
      </div>
      <small id="historyStatus" class="status" role="status" aria-live="polite" hidden></small>
      <button type="submit" id="submitBtn" class="btn-primary">打开控制台</button>
      <p class="login-foot">代理流量直连 Worker · 订阅由本面板生成</p>
    </form>
  </div>
  <small id="panelVersion" class="version">面板版本 __CFNEW_PANEL_VERSION__</small>
</main>
<script>
(function () {
  const byId = id => document.getElementById(id);
  const historyInput = byId('history');
  const historyControls = byId('historyControls');
  const deleteNode = byId('deleteNode');
  const clearAll = byId('clearAll');
  const historyStatus = byId('historyStatus');
  const hostInput = byId('host');
  const uuidInput = byId('uuid');
  const remember = byId('remember');
  const form = byId('connectForm');
  const submitBtn = byId('submitBtn');
  const tokenInput = byId('token');
  const STORAGE_KEY = 'cfnew-panel-nodes';
  let nodes = [];
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (Array.isArray(saved)) nodes = saved.filter(node => node && typeof node.host === 'string' && typeof node.uuid === 'string' && node.host.trim() && node.uuid.trim()).slice(0, 8);
  } catch {}
  function showStatus(message) {
    historyStatus.textContent = message;
    historyStatus.hidden = false;
  }
  function resetPending() {
    submitBtn.disabled = false;
    submitBtn.textContent = '打开控制台';
    form.removeAttribute('aria-busy');
  }
  window.addEventListener('pageshow', resetPending);
  function shortLabel(node) {
    const host = node.host.replace(/^https?:\/\//i, '').replace(/\/$/, '');
    if (/^[0-9a-f-]{36}$/i.test(node.uuid)) return host + ' · ' + node.uuid.slice(0, 8);
    return host + ' · /' + node.uuid.slice(0, 16) + (node.uuid.length > 16 ? '…' : '');
  }
  // Publish in-memory state only after the browser persists the change.
  function saveNodes(next) {
    try {
      if (next.length) localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      else localStorage.removeItem(STORAGE_KEY);
      nodes = next;
      return true;
    } catch { return false; }
  }
  function selectedIndex() {
    if (historyInput.value === '') return -1;
    const index = Number(historyInput.value);
    return Number.isInteger(index) && index >= 0 && index < nodes.length ? index : -1;
  }
  function renderHistory() {
    historyInput.replaceChildren(new Option('选择已保存的节点', ''));
    nodes.forEach((node, index) => historyInput.add(new Option(shortLabel(node), String(index))));
    historyControls.hidden = nodes.length === 0;
    clearAll.hidden = nodes.length < 2;
    deleteNode.disabled = true;
  }
  function fillFrom(node) {
    hostInput.value = node.host;
    uuidInput.value = node.uuid;
    hostInput.setCustomValidity('');
    uuidInput.setCustomValidity('');
    historyStatus.hidden = true;
  }
  renderHistory();
  if (nodes.length === 1) {
    fillFrom(nodes[0]); historyInput.value = '0'; deleteNode.disabled = false;
  }
  try {
    const savedToken = sessionStorage.getItem('cfnew-panel-token') || '';
    if (savedToken) { tokenInput.value = savedToken; byId('advancedConnection').open = true; }
  } catch {}
  for (const input of [hostInput, uuidInput]) input.addEventListener('input', () => {
    input.setCustomValidity('');
    historyStatus.hidden = true;
  });
  historyInput.addEventListener('change', () => {
    const index = selectedIndex();
    deleteNode.disabled = index < 0;
    if (index >= 0) fillFrom(nodes[index]);
  });
  deleteNode.addEventListener('click', () => {
    const index = selectedIndex();
    if (index < 0) return;
    const node = nodes[index];
    if (!saveNodes(nodes.filter((_, position) => position !== index))) {
      showStatus('删除失败，浏览器暂时无法保存本地记录；原记录未改变。'); return;
    }
    if (hostInput.value === node.host && uuidInput.value === node.uuid) {
      hostInput.value = ''; uuidInput.value = '';
    }
    remember.checked = false;
    renderHistory();
    showStatus('已删除这台设备上的记录，Worker 配置不受影响。');
  });
  clearAll.addEventListener('click', () => {
    if (!nodes.length || !confirm('确定清空本设备上保存的全部节点记录？')) return;
    if (!saveNodes([])) {
      showStatus('清空失败，浏览器暂时无法保存本地记录；原记录未改变。'); return;
    }
    hostInput.value = ''; uuidInput.value = ''; remember.checked = false;
    renderHistory();
    showStatus('已清空本设备全部记录，Worker 配置不受影响。');
  });
  form.addEventListener('submit', event => {
    if (submitBtn.disabled) { event.preventDefault(); return; }
    const host = hostInput.value.trim();
    const uuid = uuidInput.value.trim();
    hostInput.setCustomValidity(''); uuidInput.setCustomValidity('');
    try {
      const url = new URL(/^https?:\/\//i.test(host) ? host : 'https://' + host);
      if (!host || url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || url.pathname !== '/' || (url.port && url.port !== '443')) throw new Error();
    } catch { hostInput.setCustomValidity('请输入 HTTPS Worker 域名，不带路径、查询参数或登录信息。'); }
    if (!uuid) uuidInput.setCustomValidity('请填写 UUID 或自定义路径。');
    if (!form.reportValidity()) { event.preventDefault(); return; }
    hostInput.value = host; uuidInput.value = uuid;
    if (remember.checked) {
      const next = [{ host, uuid }, ...nodes.filter(node => !(node.host === host && node.uuid === uuid))].slice(0, 8);
      if (!saveNodes(next)) {
        event.preventDefault(); resetPending();
        showStatus('保存失败，浏览器暂时无法写入本地记录。取消勾选“记住节点”后可继续连接。'); return;
      }
    }
    try {
      const token = tokenInput.value.trim();
      tokenInput.value = token;
      if (token) sessionStorage.setItem('cfnew-panel-token', token);
      else sessionStorage.removeItem('cfnew-panel-token');
    } catch {}
    submitBtn.disabled = true;
    submitBtn.textContent = '正在打开…';
    form.setAttribute('aria-busy', 'true');
  });
})();
</script>
</body>
</html>
