<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>连接控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="landing">
<main class="login-shell">
  <div class="login-card">
    <div class="login-icon" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
        <path d="M12 3l7 3v5c0 4.5-2.8 7.6-7 9-4.2-1.4-7-4.5-7-9V6l7-3z" fill="white" fill-opacity="0.95"/>
        <path d="M10.2 12.8l-1.7-1.7 1.1-1.1 0.6 0.6 2.7-2.7 1.1 1.1-3.8 3.8z" fill="#f6821f"/>
      </svg>
    </div>
    <h1 class="login-title">连接控制台</h1>
    <p class="login-sub">填写 Worker 域名和 UUID 或自定义路径</p>
    <form action="/panel" method="get" id="connectForm" class="login-form">
      <label class="field">
        <span>Worker 域名</span>
        <input type="text" id="host" name="host" placeholder="worker.example.com" required autocomplete="off" spellcheck="false" inputmode="url">
      </label>
      <label class="field">
        <span>UUID 或自定义路径</span>
        <input type="text" id="uuid" name="uuid" placeholder="填写 UUID，或 d 设置的路径" required autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span>面板令牌（可选）</span>
        <input type="password" id="token" name="token" placeholder="仅当设置了 PANEL_TOKEN 时需要" autocomplete="off" spellcheck="false">
      </label>
      <label class="remember"><input id="remember" type="checkbox">在这台设备记住节点</label>
      <div id="historyControls" class="history-row" hidden>
        <select id="history" aria-label="已保存的节点"></select>
        <button type="button" id="deleteNode" class="btn-ghost" disabled>删除所选</button>
        <button type="button" id="clearAll" class="btn-ghost" hidden>清空全部</button>
      </div>
      <small id="historyStatus" class="status" role="status" hidden></small>
      <button type="submit" id="submitBtn" class="btn-primary">打开控制台</button>
      <p class="login-foot">代理流量直连 Worker · 订阅由本面板生成</p>
    </form>
  </div>
  <small id="panelVersion" class="version">面板版本 __CFNEW_PANEL_VERSION__</small>
</main>
<script>
(function () {
  const historyInput = document.getElementById('history');
  const historyControls = document.getElementById('historyControls');
  const deleteNode = document.getElementById('deleteNode');
  const clearAll = document.getElementById('clearAll');
  const historyStatus = document.getElementById('historyStatus');
  const hostInput = document.getElementById('host');
  const uuidInput = document.getElementById('uuid');
  const remember = document.getElementById('remember');
  const form = document.getElementById('connectForm');
  const submitBtn = document.getElementById('submitBtn');
  const tokenInput = document.getElementById('token');
  const STORAGE_KEY = 'cfnew-panel-nodes';
  let nodes = [];

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (Array.isArray(saved)) {
      nodes = saved.filter(node => node && typeof node.host === 'string' && typeof node.uuid === 'string');
    }
  } catch {}

  function shortLabel(node) {
    const host = node.host.replace(/^https?:\/\//i, '').replace(/\/$/, '');
    const id = node.uuid;
    if (/^[0-9a-f-]{36}$/i.test(id)) return host + ' · ' + id.slice(0, 8);
    return host + ' · /' + id.slice(0, 16) + (id.length > 16 ? '…' : '');
  }

  function saveNodes() {
    try {
      if (nodes.length) localStorage.setItem(STORAGE_KEY, JSON.stringify(nodes));
      else localStorage.removeItem(STORAGE_KEY);
      return true;
    } catch {
      return false;
    }
  }

  function renderHistory() {
    historyInput.replaceChildren(new Option('选择已保存的节点', ''));
    nodes.forEach((node, index) => historyInput.add(new Option(shortLabel(node), String(index))));
    historyControls.hidden = nodes.length === 0;
    clearAll.hidden = nodes.length < 2;
    deleteNode.disabled = true;
  }

  function fillFrom(node) {
    hostInput.value = node.host;
    uuidInput.value = node.uuid;
    historyStatus.hidden = true;
  }

  renderHistory();

  if (nodes.length === 1) {
    fillFrom(nodes[0]);
    historyInput.value = '0';
    deleteNode.disabled = false;
  }

  try {
    const savedToken = sessionStorage.getItem('cfnew-panel-token') || '';
    if (savedToken && tokenInput) tokenInput.value = savedToken;
  } catch {}

  historyInput.addEventListener('change', () => {
    deleteNode.disabled = historyInput.value === '';
    if (deleteNode.disabled) return;
    fillFrom(nodes[Number(historyInput.value)]);
  });

  deleteNode.addEventListener('click', () => {
    if (historyInput.value === '') return;
    const index = Number(historyInput.value);
    const node = nodes[index];
    nodes = nodes.filter((_, position) => position !== index);
    if (!saveNodes()) {
      historyStatus.textContent = '删除失败，浏览器暂时无法保存本地记录。';
      historyStatus.hidden = false;
      return;
    }
    if (hostInput.value === node.host && uuidInput.value === node.uuid) {
      hostInput.value = '';
      uuidInput.value = '';
    }
    remember.checked = false;
    renderHistory();
    historyStatus.textContent = '已删除这台设备上的记录，Worker 配置不受影响。';
    historyStatus.hidden = false;
  });

  clearAll.addEventListener('click', () => {
    if (!nodes.length || !confirm('确定清空本设备上保存的全部节点记录？')) return;
    nodes = [];
    if (!saveNodes()) {
      historyStatus.textContent = '清空失败，浏览器暂时无法保存本地记录。';
      historyStatus.hidden = false;
      return;
    }
    hostInput.value = '';
    uuidInput.value = '';
    remember.checked = false;
    renderHistory();
    historyStatus.textContent = '已清空本设备全部记录，Worker 配置不受影响。';
    historyStatus.hidden = false;
  });

  form.addEventListener('submit', (event) => {
    const host = hostInput.value.trim();
    const uuid = uuidInput.value.trim();
    if (!host || !uuid) return;

    if (submitBtn.disabled) {
      event.preventDefault();
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = '正在打开…';
    try {
      const token = tokenInput && tokenInput.value.trim();
      if (token) sessionStorage.setItem('cfnew-panel-token', token);
      else sessionStorage.removeItem('cfnew-panel-token');
    } catch {}

    if (remember.checked) {
      nodes = [{ host, uuid }, ...nodes.filter(node => !(node.host === host && node.uuid === uuid))].slice(0, 8);
      if (!saveNodes()) {
        event.preventDefault();
        submitBtn.disabled = false;
        submitBtn.textContent = '打开控制台';
        historyStatus.textContent = '保存失败，浏览器暂时无法写入本地记录。';
        historyStatus.hidden = false;
      }
    }
  });
})();
</script>
</body>
</html>
